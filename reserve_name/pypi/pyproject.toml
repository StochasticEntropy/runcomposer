[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runcomposer"
version = "0.0.1"
description = "runcomposer — a tag-based test run composer & orchestrator. Name reservation; first real release in development."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "StochasticEntropy" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/StochasticEntropy/runcomposer"

[tool.hatch.build.targets.wheel]
packages = ["src/runcomposer"]
