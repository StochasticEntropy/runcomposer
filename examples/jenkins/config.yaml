# Way 2 of 4 — remote CI trigger: the `jenkins` runner triggers a
# parameterized Jenkins job, and the job's results come back.
#
# Two runner entries for the one plugin, one per completion mode:
#   - `jenkins` (callback): the job POSTs its bundle to runcomposer's API,
#     authorized by the ingest token of its dispatch; runcomposer must be reachable from Jenkins.
#   - `jenkins-poll` (poll): runcomposer follows the queue item to the build,
#     waits for it, downloads the archived results and delivers them itself.
#
# The job is the one in ci/jenkins/ (a real Jenkins in docker); see
# ci/jenkins/README.md, whose e2e.py drives both entries against it.
#
# `parameters` maps the job's build-parameter names to templates; the first
# four are the runner's defaults, HOLD_SECONDS shows a per-run parameter
# (`run_parameters`) travelling to the job: `--param hold_s=60`.
#
# Two more entries drive a second job, `runcomposer-fanout`, that runs the
# selection in several regions — one build, one shard per region:
#   - `jenkins-fanout` (poll): the shards come from a per-run parameter, the
#     document travels compressed (`{spec_b64}`), a build parameter is
#     computed from the selection (`field_providers`), and the results are
#     read from the build's console log — a URL below the build that is not
#     an archived artifact (`result_urls`) — and cut out of it per region
#     before parsing (`postprocess`).
#   - `jenkins-fanout-push` (callback): the same job pushes each region's
#     bundle itself, with live status and log lines while it runs.
# Their two callables live in shop_job.py next to this file; start
# runcomposer with this directory importable (PYTHONPATH=examples/jenkins).
#
#   runcomposer plan Payments-Cards --runner jenkins-fanout --param 'regions=[eu,apac]' --config …
core:
  artifact_dir: state/artifacts
  ingestion: { inbox: null }
store:
  sqlite: { path: state/runcomposer.db }
sources:
  demo-corpus: {}
runners:
  jenkins:
    plugin: jenkins
    base_url: "${env:JENKINS_URL:-http://localhost:8080}"
    job: runcomposer-consumer
    completion: callback
    # How the Jenkins container reaches `runcomposer serve` on this machine.
    callback_base: "${env:RUNCOMPOSER_CALLBACK_BASE:-http://host.docker.internal:8100}"
    user: "${env:JENKINS_USER:-admin}"
    api_token: "${env:JENKINS_API_TOKEN:-}"
    parameters: &job-parameters
      SPEC_JSON: "{spec_json}"
      DISPATCH_ID: "{dispatch_id}"
      CALLBACK_URL: "{callback_url}"
      INGEST_TOKEN: "{token}"
      HOLD_SECONDS: "{params[hold_s]}"
    run_parameters: &run-parameters
      - { name: hold_s, kind: integer, default: 0, label: "Hold (s)",
          help: "Seconds the build waits before executing" }
  jenkins-poll:
    plugin: jenkins
    base_url: "${env:JENKINS_URL:-http://localhost:8080}"
    job: runcomposer-consumer
    completion: poll
    artifact_paths: ["results/*"]
    poll_interval_s: 2
    user: "${env:JENKINS_USER:-admin}"
    api_token: "${env:JENKINS_API_TOKEN:-}"
    parameters: *job-parameters
    run_parameters: *run-parameters
  jenkins-fanout:
    plugin: jenkins
    base_url: "${env:JENKINS_URL:-http://localhost:8080}"
    job: runcomposer-fanout
    completion: poll
    poll_interval_s: 2
    user: "${env:JENKINS_USER:-admin}"
    api_token: "${env:JENKINS_API_TOKEN:-}"
    run_parameters: &fanout-run-parameters
      - { name: regions, kind: multi_choice, choices: [eu, us, apac], default: [eu, us],
          label: Regions, help: "Each region runs the selection and reports as a shard of its own" }
      - { name: hold_s, kind: integer, default: 0, label: "Hold (s)" }
    shards: "{params[regions]}"
    field_providers: { include: "shop_job:include_tags" }
    parameters: &fanout-parameters
      SPEC_B64: "{spec_b64}"          # the exact document, gzipped, as base64
      REGIONS: "{shards}"
      INCLUDE: "{include}"            # computed from the selection
      DISPATCH_ID: "{dispatch_id}"
      HOLD_SECONDS: "{params[hold_s]}"
    result_urls: [consoleText]        # below the build's URL; nothing is archived
    postprocess: "shop_job:results_from_console"
  jenkins-fanout-push:
    plugin: jenkins
    base_url: "${env:JENKINS_URL:-http://localhost:8080}"
    job: runcomposer-fanout
    completion: callback
    callback_base: "${env:RUNCOMPOSER_CALLBACK_BASE:-http://host.docker.internal:8100}"
    user: "${env:JENKINS_USER:-admin}"
    api_token: "${env:JENKINS_API_TOKEN:-}"
    run_parameters: *fanout-run-parameters
    shards: "{params[regions]}"
    field_providers: { include: "shop_job:include_tags" }
    parameters:
      <<: *fanout-parameters
      CALLBACK_URL: "{callback_url}"
      INGEST_TOKEN: "{token}"
