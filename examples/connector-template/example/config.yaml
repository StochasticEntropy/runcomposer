# A runcomposer deployment that uses only the connector's plugins, named by
# their entry-point ids. Relative paths resolve against this file's
# directory, so it works from anywhere:
#
#   python example/shop_server.py --port 18765 &
#   runcomposer run Smoke --runner shop --config example/config.yaml
#
store:
  sqlite: { path: state/runcomposer.db }
sources:
  shop-checks: { plugin: http-checks, path: checks.yaml }
runners:
  shop: { plugin: http-checks, environment: local, workers: 4 }
observers:
  summary: { plugin: run-summary, path: state/summary.txt }
core:
  artifact_dir: state/artifacts
  ingestion: { inbox: null }
connectors:
  # Settings the package's plugins share (the runner declares
  # CONNECTOR = "shop-checks" and receives this mapping). ${env:…} works here
  # too, for anything secret.
  shop-checks:
    user_agent: runcomposer-shop-connector/0.1
    environments:
      local: "${env:SHOP_LOCAL_URL:-http://127.0.0.1:18765}"
      staging: "http://staging.shop.example"
