# A connector package for runcomposer — copy this directory to start yours.
# It depends on runcomposer and nothing else, registers its plugins through
# the runcomposer.* entry-point groups, and is tested with runcomposer.testing.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runcomposer-shop-connector"
version = "0.1.0"
description = "Example runcomposer connector: HTTP checks against a web shop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["runcomposer>=0.2,<0.3", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

# The entry-point names are what a config file refers to: `plugin: http-checks`.
[project.entry-points."runcomposer.sources"]
http-checks = "shop_connector.checks_source:HttpChecksSource"

[project.entry-points."runcomposer.runners"]
http-checks = "shop_connector.http_runner:HttpCheckRunner"

[project.entry-points."runcomposer.observers"]
run-summary = "shop_connector.summary_observer:RunSummaryObserver"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
