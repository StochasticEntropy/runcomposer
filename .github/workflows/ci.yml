name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job waits on conditions (a server answering, a run state), never on a
# fixed sleep.

jobs:
  lint:
    # Static checks: ruff over the package, its tests, the connector template
    # and the CI scripts; mypy (strict) over the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check src tests ci
          ruff check examples/connector-template
      - name: mypy
        run: mypy

  commit-messages:
    # The messages of the commits a change adds hold to the example-world
    # rules the tree is held to (ci/check_commit_messages.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pyyaml
      - name: The commits this change adds
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="origin/$BASE_REF..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            # A branch new to the server (or a manual run): what it has that main has not.
            range="origin/main..$SHA"
          else
            range="$BEFORE..$SHA"
          fi
          python ci/check_commit_messages.py "$range"

  tests:
    # Without the robot extra: the Robot Framework tests skip with a reason,
    # which is part of what this job proves.
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - os: macos-latest
            python-version: "3.12"
            experimental: false
          # Windows has a code path of its own (process liveness) and tests
          # that need a POSIX shell skip there with a reason. It has not yet
          # been seen green, so it does not block a merge until it has been —
          # then set experimental to false.
          - os: windows-latest
            python-version: "3.12"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -rs

  robot:
    # The robot extra (robotframework source, robot-pool, robot-output-xml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the robot extra
        run: python -m pip install -e ".[dev,robot]"
      - name: Test (robot tests included)
        run: |
          python -m pytest -q
          python -m pytest tests/test_robot_pool.py tests/test_robot_source.py tests/test_four_ways.py -q | tee robot.out
          grep -q "passed" robot.out
          ! grep -q "skipped" robot.out

  connector-template:
    # The copy-to-start connector package: installed next to runcomposer in a
    # fresh environment, its own tests (written with runcomposer.testing), and
    # one end-to-end run through `runcomposer run` with its plugins named by
    # entry point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runcomposer and the template into a fresh venv
        run: |
          python -m venv /tmp/tpl
          /tmp/tpl/bin/pip install . "./examples/connector-template[test]"
      - name: The template's tests
        working-directory: examples/connector-template
        run: /tmp/tpl/bin/python -m pytest -q
      - name: End to end through `runcomposer run`
        working-directory: examples/connector-template
        run: /tmp/tpl/bin/python example/try_it.py

  quickstart:
    # The one-command quickstart acceptance (DESIGN.md §14).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pipx quickstart
        run: pipx run --spec . runcomposer demo
      - name: the demo's own next step works when pasted (DESIGN.md §12)
        run: |
          pipx run --spec . runcomposer runs --config runcomposer-demo/config.yaml \
            --failed-in latest --label suite=nightly | tee failed.out
          grep -q "item(s) FAILED in run" failed.out
          grep -q "^Shop\." failed.out
      - name: validate the shipped example spec
        run: pipx run --spec . runcomposer validate --for-dispatch examples/webshop-regression.runspec.yaml

  export-round-trip:
    # spec --export → runcomposer-exec → ingest → COMPLETE, from an installed
    # package in a directory of its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Round trip
        run: |
          python -m venv /tmp/rt && /tmp/rt/bin/pip install -q .
          cd /tmp && printf 'store:\n  sqlite: { path: rt.db }\n' > rt-config.yaml
          /tmp/rt/bin/runcomposer spec 'Regression' --title "CI round trip" --format json -o rt-spec.json --export --config rt-config.yaml
          /tmp/rt/bin/runcomposer-exec rt-spec.json --out rt-bundle --simulate
          /tmp/rt/bin/runcomposer ingest rt-bundle --config rt-config.yaml
          /tmp/rt/bin/runcomposer runs --config rt-config.yaml | tee runs.out
          grep -q COMPLETE runs.out

  ui:
    # The committed pre-built assets must match the UI source exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: UI unit tests (vitest)
        working-directory: ui
        run: npm test
      - name: Committed bundle matches source
        run: git diff --exit-code src/runcomposer/ui_dist

  wheel:
    # Evaluators need no Node toolchain: the wheel carries the built UI. And
    # an executor needs none of the server's dependencies: the wheel installed
    # without them still gives the SDK, the remote channel and runcomposer-exec.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: pip wheel --no-deps -w dist .
      - name: A minimal install — the wheel without its dependencies
        run: |
          python -m venv /tmp/minimal && /tmp/minimal/bin/pip install --no-deps dist/*.whl
          cd /tmp && /tmp/minimal/bin/python - <<'EOF'
          import socket
          import sys

          import runcomposer.core.remote
          import runcomposer.sdk
          import runcomposer.sdk.jenkins
          import runcomposer.sdk.robot
          import runcomposer_exec
          from runcomposer.sdk import RemoteLiveChannel

          with socket.socket() as sock:  # a port nothing listens on
              sock.bind(("127.0.0.1", 0))
              port = sock.getsockname()[1]
          channel = RemoteLiveChannel(f"http://127.0.0.1:{port}/api/v1/runs/r/results", "rct_minimal", timeout_s=2)
          channel.log("nobody listens")
          assert channel.failures == 1, channel.failures
          heavy = sorted(n for n in ("yaml", "jsonschema", "fastapi", "uvicorn", "starlette", "pydantic") if n in sys.modules)
          assert not heavy, f"imported without being needed: {heavy}"
          print("minimal install:", runcomposer.__version__, "from", runcomposer.__file__)
          print("exec:", runcomposer_exec.__file__, "| progress dropped and counted:", channel.failures)
          EOF
          /tmp/minimal/bin/runcomposer-exec --help
      - name: Install into a fresh venv and serve the UI
        run: |
          python -m venv /tmp/fresh && /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/runcomposer serve --port 8199 &
          # Wait for the server to answer instead of guessing how long it takes.
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused localhost:8199/api/v1/health
          curl -sf localhost:8199/ | grep -q '<div id="root">'
          asset=$(curl -s localhost:8199/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -sf -o /dev/null "localhost:8199$asset"
          curl -sf localhost:8199/locales/de.json > /dev/null

  docker:
    # The shipped image: the demo runs in it, it does not run as root, it
    # serves, and its init (PID 1) reaps a process orphaned inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t runcomposer:ci .
      - name: docker run … runcomposer demo
        run: docker run --rm runcomposer:ci demo
      - name: The container does not run as root
        run: test "$(docker run --rm --entrypoint id runcomposer:ci -u)" != "0"
      - name: The container serves, under an init that reaps orphans
        run: |
          docker run -d --rm --name rc -p 127.0.0.1:8100:8100 runcomposer:ci
          # Docker accepts the connection before the app inside does: retry every error.
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors localhost:8100/api/v1/health
          pid1=$(docker exec rc cat /proc/1/cmdline | tr '\0' ' ')
          echo "PID 1: $pid1"
          case "$pid1" in "/usr/bin/tini -- runcomposer "*) ;; *) echo "PID 1 is not the init"; exit 1;; esac
          # A process whose parent exits at once is re-parented to PID 1; once
          # it has exited too, nothing of it may be left (no zombie entry).
          docker exec rc sh -c '(sleep 1 &) ; exit 0'
          stat_lines() { docker exec rc sh -c 'for s in /proc/[0-9]*/stat; do cat "$s" 2>/dev/null; echo; done'; }
          for _ in $(seq 1 40); do
            stat_lines | awk '$2=="(sleep)" && $3!="Z"' | grep -q . || break
            sleep 0.25
          done
          zombies=$(stat_lines | awk 'NF && $3=="Z"')
          if [ -n "$zombies" ]; then echo "zombie entries: $zombies"; exit 1; fi
          docker stop rc

  shipped-image:
    # The whole test suite inside the shipped image, as built here — its
    # Python, its SQLite (the store needs SQLite >= 3.24 with the JSON
    # functions: a base image that ships an older one fails here), its
    # non-root user, and its init as PID 1 (no `docker run --init`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t runcomposer:shipped .
      - name: Python and SQLite of the image
        run: |
          docker run --rm --entrypoint /usr/bin/tini runcomposer:shipped -- python -c '
          import sqlite3, sys
          db = sqlite3.connect(":memory:")
          print("python", sys.version.split()[0], "| sqlite", sqlite3.sqlite_version)
          print("JSON functions:", db.execute("select json_extract(?, ?)", ("{\"a\": 1}", "$.a")).fetchone()[0] == 1)
          '
      - name: The test suite in the image
        run: |
          docker run --rm -v "$PWD":/src:ro --entrypoint /usr/bin/tini runcomposer:shipped -- bash -c '
            set -e
            echo "PID 1: $(tr "\0" " " </proc/1/cmdline) | user: $(id -un)"
            mkdir -p /tmp/work && cd /src
            tar --exclude=./.git --exclude=./ui/node_modules -cf - . | tar -xf - -C /tmp/work
            cd /tmp/work
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install -q --disable-pip-version-check -e ".[dev,robot]"
            /tmp/venv/bin/python -m pytest -q'

  jenkins:
    # The `jenkins` runner against a REAL Jenkins in docker (ci/jenkins/e2e.py):
    # health, callback and poll completion, what Jenkins shows of each build
    # parameter and where one parameter's size ends, cancellation in both
    # modes and after the queue item is forgotten, the fan-out job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: ci/jenkins/e2e.py
        run: python ci/jenkins/e2e.py
