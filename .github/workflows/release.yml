name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Create GitHub release
        # The single-file consumer ships as its own asset per release, so it
        # can be vendored with a plain wget (DESIGN.md §6.2c).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "runcomposer ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            dist/*.whl dist/*.tar.gz src/runcomposer_exec.py

  pypi:
    # Publishes only when the repository variable PYPI_PUBLISH is "true" AND
    # a PYPI_API_TOKEN secret exists — the owner flips these at launch time.
    if: vars.PYPI_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
