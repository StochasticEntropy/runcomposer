name: Release

on:
  push:
    tags: ["v*"]

# One build, tested, then published as built: the files that go to the GitHub
# release and to PyPI are the very files the `verify` job installed and ran —
# nothing is rebuilt after it.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,robot]"
      - name: Lint and type-check
        run: |
          ruff check src tests
          mypy
      - name: Test
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the version
        # The version has one source (src/runcomposer/__init__.py); a tag that
        # disagrees with it must not become a release.
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/runcomposer/__init__.py').read_text()).group(1))")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ $version"
            exit 1
          fi
      - name: Build distributions (once)
        run: |
          python -m pip install build
          python -m build
          cp src/runcomposer_exec.py dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    # Install the built wheel into a clean environment and use it.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel that will be published
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          test "$(/tmp/verify/bin/python -c 'import runcomposer; print(runcomposer.__version__)')" = "${GITHUB_REF_NAME#v}"
      - name: Demo, export round trip, serve
        run: |
          cd "$(mktemp -d)"
          /tmp/verify/bin/runcomposer demo
          printf 'store:\n  sqlite: { path: rt.db }\n' > rt.yaml
          /tmp/verify/bin/runcomposer spec Regression --format json -o spec.json --export --config rt.yaml
          /tmp/verify/bin/runcomposer-exec spec.json --out bundle --simulate
          /tmp/verify/bin/runcomposer ingest bundle --config rt.yaml
          /tmp/verify/bin/runcomposer serve --port 8199 &
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused localhost:8199/api/v1/health
      - name: The vendorable consumer is the one in the wheel
        run: cmp dist/runcomposer_exec.py "$(/tmp/verify/bin/python -c 'import runcomposer_exec; print(runcomposer_exec.__file__)')"

  release:
    needs: [test, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract this version's changelog section
        # --notes-file CHANGELOG.md would put the entire file history into every
        # release. Take only the `## <version>` section, up to the next `## `.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## " ver) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no '## $version' section in CHANGELOG.md"
            exit 1
          fi
          printf '\n---\n\nFull changelog: https://github.com/%s/blob/%s/CHANGELOG.md\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" >> release-notes.md
          echo "--- release notes ---"
          cat release-notes.md
      - name: Create GitHub release
        # The single-file consumer ships as its own asset per release, so it
        # can be vendored with a plain wget (DESIGN.md §6.2c).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "runcomposer ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/*.whl dist/*.tar.gz dist/runcomposer_exec.py

  pypi:
    # Publishes only when the repository variable PYPI_PUBLISH is "true".
    #
    # Authentication is PyPI Trusted Publishing (OIDC): this job proves to PyPI
    # that it is *this* workflow in *this* repository, and PyPI issues a
    # short-lived token for the upload. There is no API token stored anywhere.
    #
    # The counterpart lives on PyPI: Manage project -> Publishing, registered as
    #   owner: StochasticEntropy   repository: runcomposer
    #   workflow: release.yml      environment: (none)
    # Those four values must match this file exactly or the upload is refused.
    if: vars.PYPI_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Only the distributions go to PyPI
        run: rm -f dist/runcomposer_exec.py && ls -l dist
      - name: Publish the tested files to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
