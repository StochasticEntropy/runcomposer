name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Extract this version's changelog section
        # --notes-file CHANGELOG.md would put the entire file history into every
        # release. Take only the `## <version>` section, up to the next `## `.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## " ver) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no '## $version' section in CHANGELOG.md"
            exit 1
          fi
          printf '\n---\n\nFull changelog: https://github.com/%s/blob/%s/CHANGELOG.md\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" >> release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub release
        # The single-file consumer ships as its own asset per release, so it
        # can be vendored with a plain wget (DESIGN.md §6.2c).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "runcomposer ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/*.whl dist/*.tar.gz src/runcomposer_exec.py

  pypi:
    # Publishes only when the repository variable PYPI_PUBLISH is "true" — the
    # owner flips that at launch time.
    #
    # Authentication is PyPI Trusted Publishing (OIDC): this job proves to PyPI
    # that it is *this* workflow in *this* repository, and PyPI issues a
    # short-lived token for the upload. There is no API token stored anywhere —
    # nothing to leak, rotate, or forget to scope.
    #
    # The counterpart lives on PyPI: Manage project -> Publishing (or, before
    # the first release, "Pending publishers") registered as
    #   owner: StochasticEntropy   repository: runcomposer
    #   workflow: release.yml      environment: (none)
    # Those four values must match this file exactly or the upload is refused.
    if: vars.PYPI_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # The whole point: mint the OIDC token PyPI verifies. Without this the
      # publish step fails with a missing-credentials error, not a hint.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
