[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runcomposer"
version = "0.1.0"
description = "Tag-based test run composer & orchestrator — compose portable run specs any executor can fulfill"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StochasticEntropy", email = "73407002+StochasticEntropy@users.noreply.github.com" }]
keywords = ["testing", "test-selection", "tags", "orchestration", "runspec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://stochasticentropy.github.io/runcomposer/"
Source = "https://github.com/StochasticEntropy/runcomposer"
Documentation = "https://github.com/StochasticEntropy/runcomposer/blob/main/ADOPTING.md"
Changelog = "https://github.com/StochasticEntropy/runcomposer/blob/main/CHANGELOG.md"
Issues = "https://github.com/StochasticEntropy/runcomposer/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Robot Framework is a dependency of the robotframework/robot-pool PLUGINS,
# never of the core (DESIGN.md §6.1) — hence an extra.
robot = ["robotframework>=6.1"]

[project.scripts]
runcomposer = "runcomposer.cli:main"
runcomposer-exec = "runcomposer_exec:main"

# Reference plugins register through the same entry-point groups any
# third-party plugin would use (DESIGN.md §6: entry points are one of the two
# first-class loading paths; the other is an import-path config declaration).
[project.entry-points."runcomposer.sources"]
manifest = "runcomposer.plugins.manifest_source:ManifestSource"
robotframework = "runcomposer.plugins.robot_source:RobotFrameworkSource"

[project.entry-points."runcomposer.runners"]
demo = "runcomposer.plugins.demo_runner:DemoRunner"
robot-pool = "runcomposer.plugins.robot_pool:RobotPoolRunner"
ci-trigger = "runcomposer.plugins.ci_trigger:CiTriggerRunner"

[project.entry-points."runcomposer.stores"]
sqlite = "runcomposer.plugins.sqlite_store:SqliteRunStore"

[project.entry-points."runcomposer.parsers"]
runcomposer-verdicts = "runcomposer.plugins.verdicts_parser:VerdictsParser"
robot-output-xml = "runcomposer.plugins.robot_output_parser:RobotOutputXmlParser"
junit-xml = "runcomposer.plugins.junit_parser:JunitXmlParser"

[tool.hatch.build.targets.wheel]
packages = ["src/runcomposer"]

[tool.hatch.build.targets.wheel.force-include]
# runcomposer-exec stays a single self-contained stdlib-only file by
# construction (DESIGN.md §6.2c) — shipped in the wheel AND vendorable as-is.
"src/runcomposer_exec.py" = "runcomposer_exec.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
