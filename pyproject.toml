[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runcomposer"
dynamic = ["version"]
description = "Tag-based test run composer & orchestrator — compose portable run specs any executor can fulfill"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StochasticEntropy", email = "73407002+StochasticEntropy@users.noreply.github.com" }]
keywords = ["testing", "test-selection", "tags", "orchestration", "runspec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://stochasticentropy.github.io/runcomposer/"
Source = "https://github.com/StochasticEntropy/runcomposer"
Documentation = "https://github.com/StochasticEntropy/runcomposer/blob/main/ADOPTING.md"
Changelog = "https://github.com/StochasticEntropy/runcomposer/blob/main/CHANGELOG.md"
Issues = "https://github.com/StochasticEntropy/runcomposer/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
# Robot Framework is a dependency of the robotframework/robot-pool PLUGINS,
# never of the core (DESIGN.md §6.1) — hence an extra.
robot = ["robotframework>=6.1"]

[project.scripts]
runcomposer = "runcomposer.cli:main"
runcomposer-exec = "runcomposer_exec:main"

# Reference plugins register through the same entry-point groups any
# third-party plugin would use (DESIGN.md §6: entry points are one of the two
# first-class loading paths; the other is an import-path config declaration).
[project.entry-points."runcomposer.sources"]
manifest = "runcomposer.plugins.manifest_source:ManifestSource"
robotframework = "runcomposer.plugins.robot_source:RobotFrameworkSource"
demo-corpus = "runcomposer.plugins.demo_source:DemoCorpusSource"

[project.entry-points."runcomposer.runners"]
demo = "runcomposer.plugins.demo_runner:DemoRunner"
robot-pool = "runcomposer.plugins.robot_pool:RobotPoolRunner"
jenkins = "runcomposer.plugins.jenkins:JenkinsRunner"
command = "runcomposer.plugins.command_runner:CommandRunner"

[project.entry-points."runcomposer.stores"]
sqlite = "runcomposer.plugins.sqlite_store:SqliteRunStore"

[project.entry-points."runcomposer.parsers"]
runcomposer-verdicts = "runcomposer.plugins.verdicts_parser:VerdictsParser"
robot-output-xml = "runcomposer.plugins.robot_output_parser:RobotOutputXmlParser"
junit-xml = "runcomposer.plugins.junit_parser:JunitXmlParser"

[project.entry-points."runcomposer.observers"]
webhook = "runcomposer.plugins.observers:WebhookObserver"
jsonl = "runcomposer.plugins.observers:JsonlObserver"
command = "runcomposer.plugins.observers:CommandObserver"

# The version lives in exactly one place: runcomposer/__init__.py.
[tool.hatch.version]
path = "src/runcomposer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/runcomposer"]

[tool.hatch.build.targets.wheel.force-include]
# runcomposer-exec stays a single self-contained stdlib-only file by
# construction (DESIGN.md §6.2c) — shipped in the wheel AND vendorable as-is.
"src/runcomposer_exec.py" = "runcomposer_exec.py"

[tool.hatch.build.targets.sdist]
# Hatchling's default sdist sweeps in everything the VCS does not ignore —
# which meant 37 MB of homepage videos and a stray agent worktree. The
# homepage's media lives on GitHub Pages; an sdist needs the sources, the
# tests that prove them, and the prose.
include = [
    "/src", "/tests", "/examples", "/ci", "/docs",
    "/README.md", "/LICENSE", "/CHANGELOG.md", "/DESIGN.md", "/ADOPTING.md",
    "/CONTRIBUTING.md", "/SECURITY.md", "/pyproject.toml", "/Dockerfile",
]
exclude = [
    "**/*.mp4", "**/*.vtt", "**/*.png", "**/*.jpg", "**/*.webp",
    "**/__pycache__", "**/*.pyc", "**/node_modules", "**/*.db",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is the formatter's business; long messages stay readable
    "SIM105",  # try/except/pass is clearer than contextlib.suppress in the hot paths
    "SIM108",
    "RUF001", "RUF002", "RUF003",  # typographic punctuation in prose is deliberate
    "B904",    # `from None` vs `from exc` is decided case by case
    "UP007",   # typing.Union spellings in protocol signatures stay as written
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "B017", "C408"]

[tool.mypy]
python_version = "3.10"
files = ["src/runcomposer", "src/runcomposer_exec.py"]
strict = true
warn_unreachable = true
# Pragmatic strictness: full strict mode for our own code; third-party
# packages without stubs (Robot Framework, jsonschema) are imported untyped.
ignore_missing_imports = true
disallow_any_generics = false
disallow_subclassing_any = false
warn_return_any = false
disallow_untyped_calls = false
