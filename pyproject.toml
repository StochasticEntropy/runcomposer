[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runcomposer"
version = "0.1.0.dev0"
description = "Tag-based test run composer & orchestrator — compose portable run specs any executor can fulfill"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StochasticEntropy", email = "73407002+StochasticEntropy@users.noreply.github.com" }]
keywords = ["testing", "test-selection", "tags", "orchestration", "runspec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/StochasticEntropy/runcomposer"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
runcomposer = "runcomposer.cli:main"

# Reference plugins register through the same entry-point groups any
# third-party plugin would use (DESIGN.md §6: entry points are one of the two
# first-class loading paths; the other is an import-path config declaration).
[project.entry-points."runcomposer.sources"]
manifest = "runcomposer.plugins.manifest_source:ManifestSource"

[project.entry-points."runcomposer.runners"]
demo = "runcomposer.plugins.demo_runner:DemoRunner"

[tool.hatch.build.targets.wheel]
packages = ["src/runcomposer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
